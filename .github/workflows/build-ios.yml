name: Build iOS IPA

on:
  push:
    branches: [main, master]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project RemoteDesk.xcodeproj \
            -scheme RemoteDesk \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/RemoteDesk.app Payload/
          zip -qr RemoteDesk.ipa Payload
          ls -la RemoteDesk.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-ipa
          path: ios/RemoteDesk.ipa
          if-no-files-found: error
